name: Tapuai Team Quality Checks

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck mobile
        run: pnpm --filter @tapuai/mobile typecheck

      - name: Typecheck admin portal
        run: pnpm --filter @tapuai/admin-portal typecheck

      - name: Check front-of-house docs match product constants
        run: pnpm docs:check

      - name: Check for Leaked Backend Keys (Security Bot)
        run: |
          if grep -rn "sk_test_" apps/mobile/src/frontend/; then
            echo "ERROR: Stripe Secret Key found in frontend code!"
            exit 1
          fi
