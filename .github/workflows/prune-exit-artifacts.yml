# Owner-triggered prune of exit-source Actions artifacts when free storage quota is full.
# Cloud-agent tokens cannot DELETE artifacts (403); this workflow uses GITHUB_TOKEN with actions:write.
name: Prune Exit Source Artifacts
on:
  workflow_dispatch:
    inputs:
      keep:
        description: Number of newest exit-source artifacts to keep
        required: true
        default: '3'
permissions:
  actions: write
  contents: read
concurrency:
  group: prune-exit-artifacts
  cancel-in-progress: false
jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Delete older exit-source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ inputs.keep }}
          REPO: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          const keep = Math.max(0, Number(process.env.KEEP || '3') || 3);
          const repo = process.env.REPO;
          const token = process.env.GH_TOKEN;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'tapuai-prune-exit-artifacts',
          };
          async function get(url) {
            const res = await fetch(url, { headers });
            if (!res.ok) throw new Error(`GET ${url} → ${res.status} ${await res.text()}`);
            return res.json();
          }
          async function del(id) {
            const res = await fetch(`https://api.github.com/repos/${repo}/actions/artifacts/${id}`, {
              method: 'DELETE',
              headers,
            });
            if (!res.ok && res.status !== 204) {
              throw new Error(`DELETE ${id} → ${res.status} ${await res.text()}`);
            }
          }
          const all = [];
          for (let page = 1; page <= 30; page += 1) {
            const data = await get(
              `https://api.github.com/repos/${repo}/actions/artifacts?per_page=100&page=${page}`,
            );
            const pageArts = data.artifacts || [];
            if (pageArts.length === 0) break;
            for (const a of pageArts) {
              if (/^exit-source-/.test(a.name)) all.push(a);
            }
            if (pageArts.length < 100) break;
          }
          all.sort((a, b) => a.created_at.localeCompare(b.created_at));
          const victims = all.slice(0, Math.max(0, all.length - keep));
          console.log(`Found ${all.length} exit-source artifacts; deleting ${victims.length}; keeping ${keep}`);
          let deleted = 0;
          for (const a of victims) {
            await del(a.id);
            deleted += 1;
            console.log(`deleted ${a.id} ${a.name}`);
          }
          console.log(`Done. deleted=${deleted}`);
          NODE
